[project]
name = "fd-desk-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<13",
  "httpx>=0.28,<1",
  "httpx2",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "rapidfuzz>=3.14,<4",
  "orjson>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
fd-desk = "fd_desk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fd_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=../data/verification/pytest"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
target-version = "py312"
line-length = 110
